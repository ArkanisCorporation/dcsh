# Release pipeline for dcsh.
#
# Two stages, both dormant until deliberately activated:
#   1. `release`     - semantic-release (shared Arkanis workflow) computes the next version from
#                      Conventional Commits, updates CHANGELOG + package.json, tags, and cuts a
#                      GitHub release. It does NOT publish to npm. Gated on the `RELEASE_ENABLED`
#                      repository variable, so the whole pipeline is inert until you set it to
#                      'true'.
#   2. `publish-npm` - publishes the built package to npm via trusted publishing (OIDC), only when
#                      stage 1 cut a new release. Runs in the `release` environment; there is no
#                      NPM_TOKEN - npm exchanges the GitHub OIDC claim for a short-lived publish
#                      token and auto-generates provenance. Requires a trusted publisher configured
#                      on npmjs.org for this repo + workflow (release.yml) + environment (release).
#
# To activate: configure the trusted publisher on npm (one-time), set repo variable
# RELEASE_ENABLED=true, then merge a feat:/fix: commit to main. See CONTRIBUTING.md / README.

name: release

on:
  push:
    branches: [main]

permissions: {}

jobs:
  release:
    name: semantic-release
    if: ${{ vars.RELEASE_ENABLED == 'true' }}
    uses: ArkanisCorporation/ci/.github/workflows/wf-release-semantic.yml@v1
    permissions:
      contents: write
      issues: write
      pull-requests: write
    with:
      node-version: 24.x
      # Plugins not bundled with semantic-release core.
      extra-plugins: |
        @semantic-release/changelog@6.0.3
        @semantic-release/git@10.0.1

  publish-npm:
    name: publish to npm
    needs: release
    if: ${{ needs.release.outputs.release-published == 'true' }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # required for trusted publishing (OIDC token exchange + provenance)
    steps:
      - name: Checkout released tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.new-tag }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org

      - name: Enable Corepack (pnpm from packageManager)
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Trusted publishing (OIDC) requires npm >= 11.5.1; upgrade regardless of the bundled version.
      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest

      # No NODE_AUTH_TOKEN: with id-token: write, npm exchanges the GitHub OIDC claim for a
      # short-lived publish token and attaches provenance automatically (publishConfig.provenance).
      # The trusted publisher on npmjs.org must name this repo + release.yml + the `release` env.
      - name: Publish to npm (trusted publishing)
        run: npm publish --access public
