# Release pipeline for dcsh.
#
# Three jobs, all dormant until deliberately activated:
#   1. `release`       - semantic-release (shared Arkanis workflow) computes the next version from
#                      Conventional Commits, updates CHANGELOG + package.json, tags, and cuts a
#                      GitHub release. It does NOT publish to npm. Runs only on push to main, gated
#                      on the `RELEASE_ENABLED` repository variable, so the pipeline is inert until
#                      you set it to 'true'.
#   2. `build-package` - checks out the tag being released, installs deps and builds, then packs the
#                      npm tarball as an artifact. Has NO id-token, so untrusted dependency lifecycle
#                      scripts that run here cannot reach the publish credential.
#   3. `publish-npm`   - downloads that tarball and publishes it via trusted publishing (OIDC): no
#                      NPM_TOKEN - npm exchanges the GitHub OIDC claim for a short-lived token and
#                      auto-generates provenance. Runs in the `release` environment and executes no
#                      build/dependency scripts (publishing a packed tarball skips npm lifecycle
#                      scripts), keeping the id-token job free of untrusted code. Requires a trusted
#                      publisher on npmjs.org for this repo + release.yml + the `release` env.
#
# Manual recovery: if semantic-release cut a version/tag but the npm publish failed, re-publish that
# existing tag WITHOUT re-cutting it - run this workflow from the Actions "Run workflow" button
# (workflow_dispatch) and pass the tag (e.g. v0.2.0). The `release` job is skipped; `build-package`
# and `publish-npm` run for that tag.
#
# To activate: configure the trusted publisher on npm (one-time), set repo variable
# RELEASE_ENABLED=true, then merge a feat:/fix: commit to main. See CONTRIBUTING.md / README.

name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_tag:
        description: 'Existing git tag to build and publish via OIDC (recovery, e.g. v0.2.0)'
        required: true
        type: string

permissions: {}

jobs:
  release:
    name: semantic-release
    if: ${{ github.event_name == 'push' && vars.RELEASE_ENABLED == 'true' }}
    uses: ArkanisCorporation/ci/.github/workflows/wf-release-semantic.yml@v1
    permissions:
      contents: write
      issues: write
      pull-requests: write
    with:
      runs-on: ${{ vars.RUNNER_DEFAULT || 'daedalus' }}
      runs-on-self-hosted: ${{ (vars.RUNNER_DEFAULT || 'daedalus') != 'ubuntu-latest' }}
      node-version: 24.x
      # Plugins not bundled with semantic-release core.
      extra-plugins: |
        @semantic-release/changelog@7.0.0
        @semantic-release/git@11.0.1

  build-package:
    name: build package tarball
    needs: release
    # Push path: only when semantic-release actually cut a new version. Dispatch path: always, for
    # the manual tag-recovery case (the release job is skipped, so always() is needed to run).
    if: ${{ always() && (needs.release.outputs.release-published == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: ${{ vars.RUNNER_DEFAULT || 'daedalus' }}
    permissions:
      contents: read
    steps:
      - name: Checkout tag to publish
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Released tag on push; the dispatch input on manual recovery.
          ref: ${{ github.event.inputs.publish_tag || needs.release.outputs.new-tag }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.x

      - name: Enable Corepack (pnpm from packageManager)
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # npm pack does not create the destination directory, so make it first.
      - name: Pack npm tarball
        run: |
          mkdir -p artifact
          npm pack --pack-destination ./artifact

      - name: Upload package tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: artifact/*.tgz
          if-no-files-found: error
          retention-days: 1

  publish-npm:
    name: publish to npm
    needs: build-package
    # The skipped `release` ancestor (dispatch path) propagates a skip down the needs chain unless
    # the job opts out with a status function. always() opts out of propagation; the result check
    # then gates on build-package having actually succeeded. A bare result check is NOT enough - it
    # still gets skip-propagated.
    if: ${{ always() && needs.build-package.result == 'success' }}
    # Hosted on purpose: npm trusted publishing and provenance only support GitHub-hosted runners.
    # Self-hosted runners are rejected by npm, so this job must not move to the daedalus pool.
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # trusted publishing (OIDC exchange + provenance); no build runs in this job
    steps:
      - name: Download package tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: artifact

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.x
          registry-url: https://registry.npmjs.org

      # Pin npm to an exact, known-good version (>= 11.5.1 for trusted publishing); bump via PR.
      - name: Pin npm for trusted publishing
        run: npm install -g npm@11.5.1

      # Publishing a pre-packed tarball runs no install/prepare/prepublishOnly lifecycle scripts, so
      # no untrusted dependency code executes in this OIDC-privileged job. Provenance is derived from
      # the GitHub Actions OIDC context (publishConfig.provenance); no NODE_AUTH_TOKEN needed.
      # The ./ prefix is required: npm reads a bare `artifact/<file>.tgz` as a GitHub owner/repo
      # shorthand (and tries to git-clone it); `./artifact/...` forces a local-file read.
      - name: Publish to npm (trusted publishing)
        run: npm publish ./artifact/*.tgz --access public
