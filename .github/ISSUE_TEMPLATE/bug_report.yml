name: Bug report
description: Something in dcsh behaves incorrectly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please do not include any bot tokens or secrets.
        For a security issue, use private reporting instead (see SECURITY.md), not a public issue.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
      placeholder: Describe the bug and the steps to reproduce it.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: dcsh version
      description: Output of `dcsh --version` or the installed npm version.
      placeholder: '1.0.0'
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node.js version
      description: Output of `node --version`.
      placeholder: 'v22.x'
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Paste any error output. Redact tokens, IDs, and anything sensitive.
      render: shell
    validations:
      required: false
